name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.3.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (linux aarch64 only)
        if: matrix.cross == true
        run: cargo install --locked cross

      - name: Build (cargo)
        if: matrix.cross != true
        run: cargo build --release --locked --target ${{ matrix.target }} -p phantomdep-cli

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release --locked --target ${{ matrix.target }} -p phantomdep-cli

      - name: Stage assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          name="phantomdep-${{ matrix.target }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/phantomdep.exe" "dist/phantomdep.exe"
            (cd dist && 7z a "${name}.zip" phantomdep.exe README.NOTE 2>/dev/null || 7z a "${name}.zip" phantomdep.exe)
          else
            cp "target/${{ matrix.target }}/release/phantomdep" "dist/phantomdep"
            (cd dist && tar -czf "${name}.tar.gz" phantomdep)
          fi
          ls -la dist

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for f in *.tar.gz *.zip; do
            [ -f "$f" ] || continue
            # macOS runners ship shasum; Windows Git Bash + Linux ship sha256sum.
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$f" > "${f}.sha256"
            else
              sha256sum "$f" > "${f}.sha256"
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phantomdep-${{ matrix.target }}
          path: |
            dist/phantomdep-*.tar.gz
            dist/phantomdep-*.tar.gz.sha256
            dist/phantomdep-*.zip
            dist/phantomdep-*.zip.sha256

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten dist
        run: |
          set -euo pipefail
          find dist -mindepth 2 -type f -exec mv {} dist/ \;
          find dist -type d -empty -delete
          ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: PhantomDep ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*
