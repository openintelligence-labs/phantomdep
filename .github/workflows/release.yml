name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.3.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (linux aarch64 only)
        if: matrix.cross == true
        run: cargo install --locked cross

      - name: Build (cargo)
        if: matrix.cross != true
        run: cargo build --release --locked --target ${{ matrix.target }} -p phantomdep-cli

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release --locked --target ${{ matrix.target }} -p phantomdep-cli

      - name: Stage assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          name="phantomdep-${{ matrix.target }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/phantomdep.exe" "dist/phantomdep.exe"
            (cd dist && 7z a "${name}.zip" phantomdep.exe README.NOTE 2>/dev/null || 7z a "${name}.zip" phantomdep.exe)
          else
            cp "target/${{ matrix.target }}/release/phantomdep" "dist/phantomdep"
            (cd dist && tar -czf "${name}.tar.gz" phantomdep)
          fi
          ls -la dist

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for f in *.tar.gz *.zip; do
            [ -f "$f" ] || continue
            # macOS runners ship shasum; Windows Git Bash + Linux ship sha256sum.
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$f" > "${f}.sha256"
            else
              sha256sum "$f" > "${f}.sha256"
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phantomdep-${{ matrix.target }}
          path: |
            dist/phantomdep-*.tar.gz
            dist/phantomdep-*.tar.gz.sha256
            dist/phantomdep-*.zip
            dist/phantomdep-*.zip.sha256

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        # NOTE: must not land in ./dist — the checkout already has repo
        # distribution templates there, and they would be globbed into the
        # release assets (happened on the first v1.0.0 run).
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten release-assets
        run: |
          set -euo pipefail
          find release-assets -mindepth 2 -type f -exec mv {} release-assets/ \;
          find release-assets -type d -empty -delete
          ls -la release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: PhantomDep ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            release-assets/*

  publish-pypi:
    # Wraps each platform binary in a platform-tagged wheel (the PyPI package
    # is a thin exec-the-binary wrapper, see dist/pypi/) and publishes via
    # trusted publishing — no tokens (publisher: this repo / release.yml / pypi).
    name: Publish PyPI wrapper
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/phantomdep
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Build sdist + platform wheels
        shell: bash
        run: |
          set -euo pipefail
          pip install --quiet build wheel
          VERSION="${TAG#v}"
          WRAP=dist/pypi/phantomdep
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" "$WRAP/pyproject.toml"
          sed -i "s/^__version__ = \".*\"/__version__ = \"${VERSION}\"/" "$WRAP/src/phantomdep/__init__.py"
          mkdir -p wheelhouse
          # sdist ships no binary: built-from-source installs get the CLI stub
          # that points at the release channels.
          (cd "$WRAP" && python -m build --sdist --outdir "$GITHUB_WORKSPACE/wheelhouse")
          declare -A TAGMAP=(
            [x86_64-unknown-linux-gnu]=manylinux_2_39_x86_64
            [aarch64-unknown-linux-gnu]=manylinux_2_17_aarch64
            [x86_64-apple-darwin]=macosx_10_12_x86_64
            [aarch64-apple-darwin]=macosx_11_0_arm64
            [x86_64-pc-windows-msvc]=win_amd64
          )
          for target in "${!TAGMAP[@]}"; do
            bindir="$WRAP/src/phantomdep/bin"
            rm -rf "$bindir" && mkdir -p "$bindir"
            art="binaries/phantomdep-${target}"
            if compgen -G "$art/*.tar.gz" > /dev/null; then
              tar -xzf "$art"/phantomdep-*.tar.gz -C "$bindir"
              chmod +x "$bindir/phantomdep"
            else
              unzip -q "$art"/phantomdep-*.zip -d "$bindir"
            fi
            rm -rf "$WRAP/build" "$WRAP"/*.egg-info /tmp/wheelbuild
            (cd "$WRAP" && python -m build --wheel --outdir /tmp/wheelbuild)
            python -m wheel tags --platform-tag "${TAGMAP[$target]}" --remove /tmp/wheelbuild/phantomdep-*-py3-none-any.whl
            mv /tmp/wheelbuild/*.whl wheelhouse/
          done
          rm -rf "$WRAP/src/phantomdep/bin"
          ls -la wheelhouse
        env:
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse
