name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (build + test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  python-pipelines:
    name: python (Phantom-DB pipelines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: phantom-db/pipelines/pyproject.toml

      - name: Install pipelines package
        working-directory: phantom-db/pipelines
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint
        working-directory: phantom-db/pipelines
        run: ruff check .

      - name: Tests
        working-directory: phantom-db/pipelines
        run: pytest -q

  vscode-extension:
    name: vscode (typescript compile + vsix package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Install deps
        working-directory: extensions/vscode
        run: npm ci

      - name: Compile TypeScript
        working-directory: extensions/vscode
        run: npx tsc -p .

      - name: Package .vsix (sanity check, not published from CI)
        working-directory: extensions/vscode
        run: npx --yes @vscode/vsce package --skip-license
