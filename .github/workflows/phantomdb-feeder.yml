name: Phantom-DB feeder

on:
  schedule:
    # Nightly at 03:00 UTC. Mock-only — no LLM costs, no network beyond PyPI/npm.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: "LLM provider (mock or ollama)"
        required: true
        default: "mock"
        type: choice
        options:
          - mock
          - ollama
      model:
        description: "Model name (e.g. codellama:7b)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pipelines
        working-directory: phantom-db/pipelines
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run feeder
        working-directory: phantom-db/pipelines
        run: |
          mkdir -p candidates ../reports
          phantomdep-feeder \
            --provider "${{ inputs.provider || 'mock' }}" \
            ${{ inputs.model && format('--model "{0}"', inputs.model) || '' }} \
            --output candidates \
            --db ../ \
            --report ../reports/feeder-$(date -u +%Y-%m-%d).json

      - name: Open PR with candidates
        uses: peter-evans/create-pull-request@v7
        with:
          branch: phantomdb/candidates-${{ github.run_id }}
          title: "phantom-db: nightly candidate sweep"
          body: |
            Auto-generated candidate phantom entries from the nightly feeder.

            **Reviewer checklist (per architecture §6.5 responsible disclosure):**
            - [ ] Confirm each candidate is a real LLM hallucination, not a typo.
            - [ ] Check whether the name is registered on the live registry.
            - [ ] Decide whether to publish (=move into `phantom-db/<eco>/<letter>/`) or hold (=keep in embargoed tier).
            - [ ] If publishing, fill in `intended_target`, `did_you_mean`, and `evidence_url`.
          labels: phantom-db, automation
          add-paths: phantom-db/pipelines/candidates/**
          commit-message: "phantom-db: nightly feeder candidates"
