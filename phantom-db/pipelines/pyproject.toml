[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantomdep-pipelines"
version = "1.0.0"
description = "Nightly LLM-hallucination probe + verifier bot for Phantom-DB."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Open Intelligence Labs" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.16,<0.17"]

[project.scripts]
phantomdep-feeder = "phantomdep_pipelines.feeder:main"
phantomdep-verifier = "phantomdep_pipelines.verifier:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "A", "C4", "SIM"]
